<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Valorant Match Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Match Predictor</h1>
    <p class="subtitle">Valorant Champions Tour - win probability by matchup</p>

    <div class="tabs">
        <button class="tab active" data-tab="live-tab">Live</button>
        <button class="tab" data-tab="upcoming-tab">Upcoming</button>
        <button class="tab" data-tab="h2h-tab">Head-to-head</button>
    </div>

    <section id="live-tab" class="tab-panel">
        <div id="live-list"></div>
        <div id="live-match"></div>
    </section>

    <section id="upcoming-tab" class="tab-panel" hidden>
        <div id="upcoming-list"></div>
        <div id="upcoming-match"></div>
    </section>

    <section id="h2h-tab" class="tab-panel" hidden>
    <div class="picker-row">
        <div class="picker">
            <label for="team1">Team 1</label>
            <select id="team1"></select>
        </div>
        <div class="vs">VS</div>
        <div class="picker">
            <label for="team2">Team 2</label>
            <select id="team2"></select>
        </div>
    </div>

    <button onclick="getPrediction()">Predict winner</button>

    <div id="result"></div>
    </section>

    <script>
        const API_URL = "https://match-predictor-ml-webapp.onrender.com";
        let teams = [];

        const team1Select = document.getElementById("team1");
        const team2Select = document.getElementById("team2");

        function populateDropdown(selectElement, excludeTeam) {
            selectElement.innerHTML = "";
            teams.forEach(team => {
                if (team !== excludeTeam) {
                    selectElement.innerHTML += `<option value="${team}">${team}</option>`;
                }
            });
        }

        async function loadTeams() {
            team1Select.innerHTML = `<option>Loading teams...</option>`;
            team2Select.innerHTML = `<option>Loading teams...</option>`;

            try {
                const response = await fetch(`${API_URL}/teams`);
                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}`);
                }
                teams = await response.json();
                populateDropdown(team1Select, null);
                populateDropdown(team2Select, team1Select.value);
            } catch (error) {
                team1Select.innerHTML = `<option>Couldn't load teams</option>`;
                team2Select.innerHTML = `<option>Couldn't load teams</option>`;
                console.error("Failed to load teams:", error);
            }
        }
        loadTeams();

        team1Select.addEventListener("change", () => {
            const currentTeam2 = team2Select.value;
            populateDropdown(team2Select, team1Select.value);
            if (currentTeam2 !== team1Select.value) {
                team2Select.value = currentTeam2;
            }
        });

        team2Select.addEventListener("change", () => {
            const currentTeam1 = team1Select.value;
            populateDropdown(team1Select, team2Select.value);
            if (currentTeam1 !== team2Select.value) {
                team1Select.value = currentTeam1;
            }
        });

        async function getPrediction() {
            const team1 = team1Select.value;
            const team2 = team2Select.value;
            const resultDiv = document.getElementById("result");

            if (team1 === team2) {
                resultDiv.innerHTML = `<p class="result-summary">Please select two different teams </p>`;
                return;
            }

            resultDiv.innerHTML = `<p class="result-summary">Loading...</p>`;

            try {
                const response = await fetch(`${API_URL}/predict?team1=${encodeURIComponent(team1)}&team2=${encodeURIComponent(team2)}`);
                if (!response.ok) {
                    resultDiv.innerHTML = `<p class = "result summary">Something went wrong (error ${response.status}). Please try again</p>`;
                }
                const data = await response.json();

                const team1Pct = (data.team1_win_probability * 100).toFixed(1);
                const team2Pct = (100 - data.team1_win_probability * 100).toFixed(1);
                const s = data.stats;
                const h2hText = s.h2h_matches_played === 0
                    ? `${team1} and ${team2} have never played each other before.`
                    : `Head-to-head: ${team1} has won ${(s.h2h_team1_winrate * 100).toFixed(1)}% of their ${s.h2h_matches_played} previous meeting(s)`;

                resultDiv.innerHTML = `
                    <div class="split-labels">
                        <span>${team1Pct}%</span>
                        <span>${team2Pct}%</span>
                    </div>
                    <div class="split-bar">
                        <div class="split-bar-fill" style="width: ${team1Pct}%;"></div>
                    </div>
                    <p class="result-summary">${team1} vs ${team2}</p>
                    <table class="stat-table">
                        <tr><th></th><th>${team1}</th><th>${team2}</th></tr>
                        <tr><td>Elo rating</td><td>${s.team1_elo}</td><td>${s.team2_elo}</td></tr>
                        <tr><td>Overall win rate</td><td>${(s.team1_overall_winrate * 100).toFixed(1)}%</td><td>${(s.team2_overall_winrate * 100).toFixed(1)}%</td></tr>
                        <tr><td>Recent form (last 10)</td><td>${(s.team1_recent_winrate * 100).toFixed(1)}%</td><td>${(s.team2_recent_winrate * 100).toFixed(1)}%</td></tr>
                    </table>
                    <p class="h2h-note">${h2hText}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="result-summary">Couldn't reach the server. Please check your connection and try again.</p>`;
                console.error("Prediction request failed:", error);
            }
        }

        function showTab(tabId) {
            document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t.dataset.tab === tabId));
            document.querySelectorAll(".tab-panel").forEach(p => p.hidden = p.id !== tabId);
        }

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => showTab(tab.dataset.tab));
        });

        const POLL_MS = 30000;
        const LIST_REFRESH_MS = 60000;
        const liveList = document.getElementById("live-list");
        const liveMatch = document.getElementById("live-match");
        const upcomingList = document.getElementById("upcoming-list");
        const upcomingMatch = document.getElementById("upcoming-match");
        const liveTabButton = document.querySelector('.tab[data-tab="live-tab"]');
        const upcomingTabButton = document.querySelector('.tab[data-tab="upcoming-tab"]');
        let pollTimer = null;
        let history = []; 

        function esc(text) {
            const div = document.createElement("div");
            div.textContent = text;
            return div.innerHTML;
        }

        const pct = p => (p * 100).toFixed(1);

        function renderMatchList(container, matches, label, emptyText, onClick) {
            if (matches.length === 0) {
                container.innerHTML = `<p class="result-summary">${emptyText}</p>`;
                return;
            }
            container.innerHTML = `
                <p class="section-label">${label}</p>
                ${matches.map(m => `
                    <button class="match-row" data-id="${m.match_id}">
                        <span class="match-row-teams">${esc(m.team1)} <span class="vs-small">vs</span> ${esc(m.team2)}</span>
                        <span class="match-row-meta">
                            ${m.status === "live" ? `<span class="live-badge">Live</span> · ` : ""}${esc(m.series || m.event)}
                        </span>
                    </button>
                `).join("")}
            `;
            container.querySelectorAll(".match-row").forEach((row, i) => {
                row.addEventListener("click", () => onClick(matches[i]));
            });
        }

        let firstLoad = true;
        async function loadMatches() {
            if (firstLoad) {
                const loading = `<p class="result-summary">Loading matches... (the server may take a minute to wake up)</p>`;
                liveList.innerHTML = loading;
                upcomingList.innerHTML = loading;
            }
            try {
                const response = await fetch(`${API_URL}/live/matches`);
                if (!response.ok) throw new Error(`Server returned ${response.status}`);
                const matches = await response.json();
                const live = matches.filter(m => m.status === "live");
                const upcoming = matches.filter(m => m.status !== "live");

                liveTabButton.textContent = live.length ? `Live (${live.length})` : "Live";
                upcomingTabButton.textContent = upcoming.length ? `Upcoming (${upcoming.length})` : "Upcoming";

                renderMatchList(liveList, live, "Live matches",
                    `No live matches between partnered teams right now. Check the Upcoming tab for what's next.`,
                    m => followMatch(m.match_id));
                renderMatchList(upcomingList, upcoming, "Upcoming matches",
                    "No upcoming matches between partnered teams right now.",
                    showUpcomingMatch);

                if (firstLoad && live.length === 0 && upcoming.length > 0) showTab("upcoming-tab");
                firstLoad = false;
            } catch (error) {
                if (firstLoad) {
                    const failed = `<p class="result-summary">Couldn't load matches. Please try again in a minute.</p>`;
                    liveList.innerHTML = failed;
                    upcomingList.innerHTML = failed;
                }
                console.error("Failed to load matches:", error);
            }
        }
        loadMatches();
        setInterval(loadMatches, LIST_REFRESH_MS);

        async function showUpcomingMatch(match) {
            upcomingMatch.innerHTML = `<p class="result-summary">Loading match...</p>`;
            upcomingMatch.scrollIntoView({ behavior: "smooth", block: "start" });
            try {
                const response = await fetch(`${API_URL}/predict?team1=${encodeURIComponent(match.team1)}&team2=${encodeURIComponent(match.team2)}`);
                const data = await response.json();
                if (!response.ok) {
                    upcomingMatch.innerHTML = `<p class="result-summary">${esc(data.detail || `Something went wrong (error ${response.status}).`)}</p>`;
                    return;
                }
                renderUpcomingMatch(match, data);
            } catch (error) {
                upcomingMatch.innerHTML = `<p class="result-summary">Couldn't reach the server. Please try again.</p>`;
                console.error("Upcoming match request failed:", error);
            }
        }

        function renderUpcomingMatch(match, data) {
            const t1 = esc(data.team1), t2 = esc(data.team2);
            const p = data.team1_win_probability;
            const s = data.stats;

            upcomingMatch.innerHTML = `
                <p class="result-summary">${t1} vs ${t2} · ${esc(match.series || match.event)} · Pre-match odds</p>
                <div class="split-labels">
                    <span>${t1} ${pct(p)}%</span>
                    <span>${pct(1 - p)}% ${t2}</span>
                </div>
                <div class="split-bar">
                    <div class="split-bar-fill" style="width: ${pct(p)}%;"></div>
                </div>
                <table class="stat-table">
                    <tr><th></th><th>${t1}</th><th>${t2}</th></tr>
                    <tr><td>Elo rating</td><td>${s.team1_elo}</td><td>${s.team2_elo}</td></tr>
                    <tr><td>Overall win rate</td><td>${pct(s.team1_overall_winrate)}%</td><td>${pct(s.team2_overall_winrate)}%</td></tr>
                    <tr><td>Recent form (last 10)</td><td>${pct(s.team1_recent_winrate)}%</td><td>${pct(s.team2_recent_winrate)}%</td></tr>
                </table>
                <p class="h2h-note">${s.h2h_matches_played === 0
                    ? `${t1} and ${t2} have never played each other before.`
                    : `Head-to-head: ${t1} has won ${pct(s.h2h_team1_winrate)}% of their ${s.h2h_matches_played} previous meeting(s).`}</p>
                <p class="h2h-note">We will move you to the live tab when the match starts.</p>
            `;
        }

        function followMatch(matchId) {
            clearTimeout(pollTimer);
            history = [];
            liveMatch.innerHTML = `<p class="result-summary">Loading match...</p>`;
            liveMatch.scrollIntoView({ behavior: "smooth", block: "start" });
            pollMatch(matchId);
        }

        async function pollMatch(matchId) {
            try {
                const response = await fetch(`${API_URL}/live/${matchId}`);
                const data = await response.json();
                if (!response.ok) {
                    liveMatch.innerHTML = `<p class="result-summary">${esc(data.detail || `Something went wrong (error ${response.status}).`)}</p>`;
                    return;
                }
                if (history[history.length - 1] !== data.live_win_probability) {
                    history.push(data.live_win_probability);
                }
                renderLiveMatch(data);
                if (data.status !== "final") {
                    pollTimer = setTimeout(() => pollMatch(matchId), POLL_MS);
                }
            } catch (error) {
                console.error("Live update failed:", error);
                pollTimer = setTimeout(() => pollMatch(matchId), POLL_MS);
            }
        }

        function trendLine(points) {
            if (points.length < 2) return "";
            const w = 100, h = 40;
            const coords = points.map((p, i) => `${(i / (points.length - 1)) * w},${(1 - p) * h}`).join(" ");
            return `
                <svg class="trend" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="Win probability trend">
                    <line x1="0" y1="${h / 2}" x2="${w}" y2="${h / 2}" class="trend-mid" />
                    <polyline points="${coords}" class="trend-line" />
                </svg>
            `;
        }

        function renderLiveMatch(data) {
            const t1 = esc(data.team1), t2 = esc(data.team2);
            const p = data.live_win_probability;
            const [won, lost] = data.maps_won;
            const statusText = data.status === "live" ? `<span class="live-badge">Live</span>`
                : data.status === "final" ? "Final" : "Not started";

            const mapRows = data.maps.map((m, i) => {
                const isCurrent = !m.finished;
                const mapProb = isCurrent && data.current_map_win_probability !== null
                    ? `${pct(data.current_map_win_probability)}%` : (m.score1 > m.score2 ? t1 : t2) + " won";
                return `<tr class="${isCurrent ? "current-map" : ""}">
                    <td>Map ${i + 1}${m.map ? ` · ${esc(m.map)}` : ""}</td>
                    <td>${m.score1} - ${m.score2}</td>
                    <td>${mapProb}</td>
                </tr>`;
            }).join("");

            liveMatch.innerHTML = `
                <p class="result-summary">${t1} vs ${t2} · Bo${data.best_of} · ${statusText} · Maps ${won}-${lost}</p>
                <div class="split-labels">
                    <span>${t1} ${pct(p)}%</span>
                    <span>${pct(1 - p)}% ${t2}</span>
                </div>
                <div class="split-bar">
                    <div class="split-bar-fill" style="width: ${pct(p)}%;"></div>
                </div>
                ${trendLine(history)}
                <p class="h2h-note">Pre-match: ${t1} ${pct(data.pre_match_win_probability)}%
                    (≈${pct(data.implied_map_win_probability)}% per map, ${pct(data.implied_round_win_probability)}% per round)</p>
                ${data.maps.length ? `
                    <table class="stat-table">
                        <tr><th>Map</th><th>Rounds</th><th>${t1} map win</th></tr>
                        ${mapRows}
                    </table>` : ""}
                <p class="h2h-note">Updates every 30s from vlr.gg, which can lag behind the broadcast.
                    Assumes every round is an independent coin flip weighted by the pre-match odds, so side, economy and map picks aren't factored in.</p>
            `;
        }
    </script>
</body>

</html>
