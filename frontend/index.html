<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Valorant Match Predictor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Match Predictor</h1>
    <p class="subtitle">Valorant Champions Tour — win probability by matchup</p>

    <div class="picker-row">
        <div class="picker">
            <label for="team1">Team 1</label>
            <select id="team1"></select>
        </div>
        <div class="vs">VS</div>
        <div class="picker">
            <label for="team2">Team 2</label>
            <select id="team2"></select>
        </div>
    </div>

    <button onclick="getPrediction()">Predict winner</button>

    <div id="result"></div>

    <script>
        const API_URL = "https://match-predictor-ml-webapp.onrender.com";
        let teams = [];

        const team1Select = document.getElementById("team1");
        const team2Select = document.getElementById("team2");

        function populateDropdown(selectElement, excludeTeam) {
            selectElement.innerHTML = "";
            teams.forEach(team => {
                if (team !== excludeTeam) {
                    selectElement.innerHTML += `<option value="${team}">${team}</option>`;
                }
            });
        }

        async function loadTeams() {
            const response = await fetch(`${API_URL}/teams`);
            console.log("Response status:", response.status);
            teams = await response.json();
            console.log("Teams received:", teams);
            populateDropdown(team1Select, null);
            populateDropdown(team2Select, team1Select.value);
        }

        loadTeams();

        team1Select.addEventListener("change", () => {
            const currentTeam2 = team2Select.value;
            populateDropdown(team2Select, team1Select.value);
            if (currentTeam2 !== team1Select.value) {
                team2Select.value = currentTeam2;
            }
        });

        team2Select.addEventListener("change", () => {
            const currentTeam1 = team1Select.value;
            populateDropdown(team1Select, team2Select.value);
            if (currentTeam1 !== team2Select.value) {
                team1Select.value = currentTeam1;
            }
        });

        async function getPrediction() {
            const team1 = team1Select.value;
            const team2 = team2Select.value;
            const resultDiv = document.getElementById("result");

            resultDiv.innerHTML = `<p class="result-summary">Loading...</p>`;

            const response = await fetch(`${API_URL}/predict?team1=${encodeURIComponent(team1)}&team2=${encodeURIComponent(team2)}`);
            const data = await response.json();

            const team1Pct = (data.team1_win_probability * 100).toFixed(1);
            const team2Pct = (100 - data.team1_win_probability * 100).toFixed(1);
            const s = data.stats;
            const h2hText = s.h2h_matches_played === 0
                ? `${team1} and ${team2} have never played each other before.`
                : `Head-to-head: ${team1} has won ${(s.h2h_team1_winrate * 100).toFixed(1)}% of their ${s.h2h_matches_played} previous meeting(s)`;

            resultDiv.innerHTML = `
                <div class="split-labels">
                    <span>${team1Pct}%</span>
                    <span>${team2Pct}%</span>
                </div>
                <div class="split-bar">
                    <div class="split-bar-fill" style="width: ${team1Pct}%;"></div>
                </div>
                <p class="result-summary">${team1} vs ${team2}</p>
                <table class="stat-table">
                    <tr><th></th><th>${team1}</th><th>${team2}</th></tr>
                    <tr><td>Overall win rate</td><td>${(s.team1_overall_winrate * 100).toFixed(1)}%</td><td>${(s.team2_overall_winrate * 100).toFixed(1)}%</td></tr>
                    <tr><td>Recent form (last 10)</td><td>${(s.team1_recent_winrate * 100).toFixed(1)}%</td><td>${(s.team2_recent_winrate * 100).toFixed(1)}%</td></tr>
                </table>
                <p class="h2h-note">${h2hText}</p>
            `;
        }
    </script>
</body>

</html>
